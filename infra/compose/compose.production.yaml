services:
  backend:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      SMTP_HOST: ${POSTAL_SMTP_HOST:?Set POSTAL_SMTP_HOST in production}
      SMTP_PORT: ${POSTAL_SMTP_PORT:-2525}
      POSTAL_API_KEY: ${POSTAL_API_KEY:?Set POSTAL_API_KEY in production}
    restart: unless-stopped

  worker:
    environment:
      APP_ENV: production
    restart: unless-stopped

  report-worker:
    environment:
      APP_ENV: production
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SUBSPHERE_DOMAIN: ${SUBSPHERE_DOMAIN:?Set SUBSPHERE_DOMAIN in production}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
