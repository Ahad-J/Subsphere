services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-openmeter}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  openmeter:
    build: ../../backend
    image: subsphere/openmeter:4.0.0
    command: ["python", "/opt/services/containers/service_runner.py", "openmeter"]
    environment:
      OPENMETER_CLICKHOUSE_ADDRESS: clickhouse:9000
      OPENMETER_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-openmeter}
      OPENMETER_PORT: "8888"
    volumes:
      - ../../services:/opt/services:ro
      - subsphere_data:/data/subsphere
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [internal]

volumes:
  clickhouse_data:
