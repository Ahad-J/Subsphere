<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SubSphere Extension Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 32px auto; color: #0f172a; line-height: 1.5; }
    .card { border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; margin-bottom: 16px; background: #fff; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 9px 14px; border: 0; border-radius: 6px; background: #1e3a8a; color: #fff; font-weight: 600; cursor: pointer; }
    .note { background: #f1f5f9; padding: 10px 14px; border-radius: 6px; font-size: 12px; color: #334155; }
  </style>
</head>
<body>
  <h1>SubSphere Activity Observer — Options &amp; Privacy Boundaries</h1>
  <div class="note">
    <strong>What we capture:</strong> Only hostname (e.g. <code>claude.ai</code>), daily focused seconds, and visit counts for your explicit allowlist.<br />
    <strong>What we NEVER read:</strong> Full URLs, query parameters, AI prompts, responses, cookies, DOM content, or non-allowlisted sites.
  </div>
  <div class="card">
    <label for="apiUrl">SubSphere Backend API URL</label>
    <input id="apiUrl" type="text" placeholder="http://localhost:8000" />
    <label for="dashUrl">SubSphere Frontend Dashboard URL</label>
    <input id="dashUrl" type="text" placeholder="http://localhost:8080" />
    <label for="deviceName">Device Label</label>
    <input id="deviceName" type="text" placeholder="chrome-desktop" />
    <label for="allowlist">Consented Allowlisted Domains (comma separated)</label>
    <textarea id="allowlist" rows="3"></textarea>
    <button id="saveBtn">Save Options</button>
    <span id="msg" style="margin-left:10px;font-size:12px;color:#0f766e;"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
